<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Cart | Pulse</title>
    <style>
        /* --- PULSE THEME VARIABLES --- */
        :root {
            --bg-black: #121212;
            --bg-dark: #1e1e1e;
            --bg-card: #252525;
            --brand-red: #cc0000;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --border-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
        }

        /* --- LAYOUT --- */
        .page-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr; /* 2/3 Items, 1/3 Summary */
            gap: 40px;
            align-items: start;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: -1px;
            line-height: 1;
        }

        .cart-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .item-count {
            color: var(--text-gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- LEFT: ITEMS LIST --- */
        .cart-items-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            gap: 20px;
            transition: border-color 0.2s;
        }

        .cart-item-card:hover {
            border-color: #555;
        }

        /* Image Thumbnail */
        .item-thumb {
            width: 100px;
            height: 100px;
            background-color: #fff; /* White bg for product clarity */
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            flex-shrink: 0;
        }

        .item-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Info Section */
        .item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 5px;
        }

        .item-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .item-price {
            color: var(--brand-red);
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: auto; /* Push to bottom */
        }

        /* Actions Section (Right side of card) */
        .item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            min-width: 120px;
        }

        /* Quantity Form */
        .qty-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-input {
            width: 50px;
            padding: 5px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }

        /* Buttons */
        .btn-update {
            background: transparent;
            color: var(--text-gray);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-update:hover { border-color: var(--text-white); color: var(--text-white); }

        .btn-delete {
            background: transparent;
            border: none;
            color: #777;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .btn-delete:hover { color: var(--brand-red); }

        .line-total {
            font-size: 0.9rem;
            color: var(--text-white);
            font-weight: 600;
        }

        /* --- RIGHT: SUMMARY SECTION --- */
        .summary-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            position: sticky;
            top: 20px; /* Sticks on scroll */
        }

        .summary-title {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-white);
        }

        .btn-checkout {
            width: 100%;
            background-color: var(--brand-red);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }

        .btn-checkout:hover {
            background-color: #aa0000;
        }

        .note {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-top: 15px;
            text-align: center;
            opacity: 0.7;
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px;
            background-color: var(--bg-dark);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            color: var(--text-gray);
        }

        @media (max-width: 900px) {
            .page-container { grid-template-columns: 1fr; }
            .summary-card { position: static; }
        }

        /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- 1. CART HAS ITEMS -->
<div class="page-container" th:if="${cart != null}">

    <!-- LEFT COLUMN -->
    <div>
        <div class="cart-header">
            <h1>My Cart</h1>
            <span class="item-count" th:text="${#lists.size(cart.cartItems)} + ' ITEMS'">0 ITEMS</span>
        </div>

        <div class="cart-items-wrapper" th:if="${cart.cartItems != null and !#lists.isEmpty(cart.cartItems)}">

            <div class="cart-item-card" th:each="item : ${cart.cartItems}">
                <!-- Image -->
                <div class="item-thumb">
                    <img th:src="@{/images/tempImage.avif}" alt="Product">
                </div>

                <!-- Details -->
                <div class="item-info">
                    <div>
                        <div class="item-title" th:text="${item.variant.product.name}">Product Name</div>
                        <div class="item-meta">
                            <span th:text="'Color: ' + ${item.variant.color}">Color</span>
                        </div>
                    </div>
                    <div class="item-price" th:text="'Rs. ' + ${item.variant.product.price}">Rs. 0</div>
                </div>

                <!-- Actions -->
                <div class="item-actions">
                    <!-- Update Form -->
                    <form class="qty-form" th:action="@{/cart/item/update}" method="post">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input class="qty-input" type="number" min="1" name="quantity" th:value="${item.quantity}">
                        <button class="btn-update" type="submit">Update</button>
                    </form>

                    <!-- Calculated Line Total (Display Only) -->
                    <div class="line-total"
                         th:text="'Total: Rs. ' + ${item.variant.product.price * item.quantity}">
                        Total: 0
                    </div>

                    <!-- Delete Form -->
                    <form th:action="@{/cart/item/delete}" method="post">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <button class="btn-delete" type="submit">Remove</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Empty State (Inside Cart Object) -->
        <div class="empty-state" th:if="${cart.cartItems == null or #lists.isEmpty(cart.cartItems)}">
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added any tech gear yet.</p>
        </div>
    </div>

    <!-- RIGHT COLUMN: SUMMARY -->
    <div class="summary-card" th:if="${cart.cartItems != null and !#lists.isEmpty(cart.cartItems)}">
        <div class="summary-title">Order Summary</div>

        <!-- LOGIC: Calculating Total inside Thymeleaf loop -->
        <!-- NOTE: The 'total' variable is calculated silently here -->
        <div th:with="total=0">
            <!-- This loop runs but doesn't print anything, just sums up the total -->
            <div th:each="item : ${cart.cartItems}"
                 th:with="line=${item.variant.product.price * item.quantity}, total=${total + line}">

                <!-- ONLY print the total on the LAST item iteration -->
                <div th:if="${itemStat.last}" class="summary-total">
                    <span>Total</span>
                    <span style="color: var(--brand-red);" th:text="'Rs. ' + ${total}">0</span>
                </div>
            </div>
        </div>

        <form th:action="@{/order/delivery}" method="get">
            <button class="btn-checkout" type="submit">Place Order</button>
        </form>

        <div class="note">Login required to checkout</div>
    </div>

</div>

<!-- 2. CART IS NULL (Fully Empty State) -->
<div class="page-container" th:if="${cart == null}">
    <div class="empty-state">
        <h1>My Cart</h1>
        <p>Your cart is currently empty.</p>
    </div>
</div>

</body>
</html>
