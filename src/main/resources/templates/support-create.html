<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Support | Pulse</title>
    <style>
        /* --- PULSE THEME --- */
        :root {
            --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000; --text-white: #ffffff; --border: #333;
        }
        body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; }

        .form-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top:0; border-left: 5px solid var(--brand-red); padding-left: 15px; text-transform: uppercase; margin-bottom: 30px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #b3b3b3; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }

        input, select, textarea {
            width: 100%; padding: 14px; background-color: #2a2a2a; border: 1px solid var(--border);
            color: var(--text-white); border-radius: 6px; font-family: inherit; font-size: 1rem;
        }

        /* Locked Field Style */
        .locked-input {
            background-color: #151515 !important;
            color: #777 !important;
            cursor: not-allowed;
            border-color: #222;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%; background-color: var(--brand-red); color: white; padding: 15px;
            font-weight: 800; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background-color: #aa0000; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="form-card">

        <!-- DYNAMIC HEADER -->
        <h2 th:text="${isLocked} ? 'Cancel Order #' + ${preOrderId} : 'Contact Support'">Contact Support</h2>

        <!-- DYNAMIC ACTION URL -->
        <!-- If it's a cancellation, send to /cancel/submit. Otherwise /support/save -->
        <form th:action="${preType == 'CANCELLATION'} ? @{/cancel/submit} : @{/support/save}"
              th:object="${ticket}"
              method="post">

            <!-- Hidden Fields -->
            <input type="hidden" name="orderId" th:value="${preOrderId}">

            <!-- 1. TICKET TYPE -->
            <div class="form-group">
                <label>Type</label>

                <!-- LOCKED MODE (Cancellation) -->
                <div th:if="${isLocked}">
                    <!-- Show the Enum value as text -->
                    <input type="text" class="locked-input" th:value="${ticket.type}" readonly>
                    <!-- Send it hiddenly -->
                    <input type="hidden" th:field="*{type}">
                </div>

                <!-- UNLOCKED MODE (Contact Us) -->
                <div th:unless="${isLocked}">
                    <select th:field="*{type}">
                        <option value="COMPLAINT">Complaint</option>
                        <option value="INQUIRY">General Inquiry</option>
                        <option value="WARRANTY">Warranty Claim</option>
                    </select>
                </div>
            </div>

            <!-- 2. SUBJECT -->
            <div class="form-group">
                <label>Subject</label>

                <!-- The value is auto-filled by the Controller -->
                <!-- If Locked, make it Readonly -->
                <input type="text" th:field="*{subject}"
                       th:classappend="${isLocked} ? 'locked-input' : ''"
                       th:readonly="${isLocked}"
                       placeholder="Brief summary..." required>
            </div>

            <!-- 3. DESCRIPTION (Reason) -->
            <div class="form-group">
                <label th:text="${isLocked} ? 'Reason for Cancellation' : 'Description'"></label>
                <!-- We bind this to 'description' in the Ticket object -->
                <!-- For cancellation, the controller maps 'description' to 'reason' -->
                <textarea name="description" rows="5"
                          th:placeholder="${isLocked} ? 'e.g. Changed my mind, Ordered by mistake...' : 'Please describe your issue...'"
                          required></textarea>
            </div>

            <button type="submit" class="btn-submit"
                    th:text="${isLocked} ? 'Confirm Cancellation' : 'Submit Ticket'">
                Submit Request
            </button>

        </form>
    </div>
</div>

</body>
</html>
