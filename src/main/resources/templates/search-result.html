<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results | Pulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- PULSE THEME VARIABLES --- */
        :root {
            --brand-black: #000000;
            --brand-red: #cc0000;
            --bg-light: #f4f4f4;
            --card-white: #ffffff;
            --text-dark: #333333;
            --text-gray: #777777;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* --- LAYOUT --- */
        .container {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 60vh; /* Ensures footer stays down if few results */
        }

        .page-title {
            font-size: 2em;
            margin-bottom: 30px;
            padding-left: 15px;
            border-left: 8px solid var(--brand-black);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap; /* Allows cards to drop to next line */
        }

        /* --- CARD DESIGN (Matching Home Page) --- */
        .product-card {
            background-color: var(--card-white);
            border: 1px solid #e0e0e0;
            width: 280px; /* Good size for search results */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
            border-color: var(--brand-red);
        }

        /* IMAGE STYLING */
        .card-image-container {
            width: 100%;
            height: 200px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .card-image-container img {
            transform: scale(1.05);
        }

        /* TEXT CONTENT */
        .card-content {
            padding: 20px;
            text-align: center;
        }

        .category-label {
            font-size: 0.75rem;
            color: var(--brand-red);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .product-name {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0 0 10px 0;
            line-height: 1.3;
            height: 45px; /* Fixed height for alignment */
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            color: var(--brand-black);
            font-size: 1.2em;
            font-weight: 800;
            margin-bottom: 5px;
        }

        /* BUTTON */
        .view-btn {
            background-color: var(--brand-black);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: none;
            display: block;
            margin: 0 20px 20px 20px;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .view-btn:hover {
            background-color: var(--brand-red);
        }

        /* --- EMPTY STATE --- */
        .no-results {
            text-align: center;
            padding: 50px;
            color: var(--text-gray);
        }
        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .back-link {
            color: var(--brand-red);
            text-decoration: none;
            font-weight: bold;
        }

        /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }

    </style>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <h2 class="page-title">Search Results</h2>

    <!-- GRID LAYOUT -->
    <div class="product-grid" th:if="${not #lists.isEmpty(productsList)}">

        <div class="product-card" th:each="product : ${productsList}">

            <!-- IMAGE -->
            <div class="card-image-container">
                <img th:src="@{/images/tempImage.avif}" alt="Product Image">
            </div>

            <!-- CONTENT -->
            <div class="card-content">
                <div class="category-label" th:text="${product.category != null ? product.category.name : 'Item'}">Category</div>
                <div class="product-name" th:text="${product.name}">Product Name</div>
                <div class="product-price" th:text="'Rs. ' + ${product.price}">0.00</div>
            </div>

            <!-- BUTTON -->
            <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
        </div>

    </div>

    <!-- EMPTY STATE (If no products found) -->
    <div class="no-results" th:if="${#lists.isEmpty(productsList)}">
        <h3>No products found.</h3>
        <p>Try searching for specific keywords like "Headphones" or "Watch".</p>
        <br>
        <a href="/" class="back-link">← Go Back Home</a>
    </div>

</div>

</body>
</html>
