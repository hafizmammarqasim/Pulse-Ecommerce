<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Super Admin | Pulse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* --- COPY/PASTE THE SAME CSS FROM ADMIN-DASHBOARD.HTML --- */
    :root { --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000; --text-white: #ffffff; --text-gray: #b3b3b3; --border-color: #333; }
    body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 250px; background-color: var(--bg-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
    .logo { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 40px; }
    .logo span { color: var(--brand-red); }
    .nav-menu { list-style: none; padding: 0; margin: 0; }
    .nav-link { display: flex; align-items: center; gap: 15px; color: var(--text-gray); text-decoration: none; padding: 12px 15px; border-radius: 6px; font-weight: 600; margin-bottom: 5px; transition: all 0.2s; }
    .nav-link.active, .nav-link:hover { background-color: var(--brand-red); color: white; }
    .nav-link i { width: 20px; text-align: center; }
    .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
    h1 { font-size: 2rem; margin: 0 0 10px 0; }
    .page-subtitle { color: var(--text-gray); margin-bottom: 30px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 40px; }
    .kpi-card { background-color: var(--bg-dark); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); }
    .kpi-label { font-size: 0.9rem; color: var(--text-gray); }
    .kpi-value { font-size: 2.5rem; font-weight: 800; color: var(--text-white); }
    .kpi-value.red { color: var(--brand-red); }
    h2 { font-size: 1.5rem; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    .form-card { background: var(--bg-dark); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
    input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border-color); color: white; border-radius: 4px; }
    .btn-submit { background: var(--brand-red); color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Logout button specific styles */
    .logout-section { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color); }
    .logout-button { width: 100%; background: none; border: none; text-align: left; padding: 12px 15px; border-radius: 6px; color: var(--text-gray); font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 15px; }
    .logout-button:hover { background-color: #444; color: white; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">PULSE<span>.</span> ADMIN</div>
  <ul class="nav-menu">
    <li><a href="/admin/dashboard" class="nav-link active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
    <li><a href="/admin/users" class="nav-link"><i class="fas fa-users-cog"></i> User Management</a></li>
  </ul>

  <div class="logout-section">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="logout-button">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </form>
  </div>
</div>

<div class="main-content">

  <h1>Super Admin Dashboard</h1>
  <p class="page-subtitle">Manage users and view high-level analytics.</p>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Total Revenue</div>
      <div class="kpi-value" th:text="'Rs. ' + ${stats.totalRevenue}">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Orders</div>
      <div class="kpi-value" th:text="${stats.totalOrders}">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Customers</div>
      <div class="kpi-value" th:text="${stats.totalCustomers}">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Avg. Order Value</div>
      <div class="kpi-value" th:text="'Rs. ' + ${stats.avgOrderValue}">0</div>
    </div>
  </div>

  <h2>Create New Admin Account</h2>
  <div class="form-card">
    <form action="/admin/users/create" method="post">
      <div class="form-grid">
        <div>
          <label style="font-size:0.8rem; color:#888;">Email</label>
          <input type="email" name="email" required>
        </div>
        <div>
          <label style="font-size:0.8rem; color:#888;">Password</label>
          <input type="password" name="password" required>
        </div>
        <div>
          <label style="font-size:0.8rem; color:#888;">Role</label>
          <select name="role">
            <option value="ORDER_MANAGER">Order Manager</option>
            <option value="PRODUCT_MANAGER">Product Manager</option>
          </select>
        </div>
        <div>
          <button type="submit" class="btn-submit">Create Admin</button>
        </div>
      </div>
    </form>
  </div>

</div>

</body>
</html>
