<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Return History | Admin</title>

    <style>
        /* --- PULSE ADMIN THEME --- */
                :root {
                    --bg-black: #121212;
                    --bg-dark: #1e1e1e;
                    --brand-red: #cc0000;
                    --text-white: #ffffff;
                    --text-gray: #b3b3b3;
                    --border-color: #333;
                }

                body {
                    background-color: var(--bg-black);
                    color: var(--text-white);
                    font-family: 'Segoe UI', sans-serif;
                    margin: 0;
                    display: flex;
                    height: 100vh;
                    overflow: hidden;
                }

                /* --- SIDEBAR (Consistent Style) --- */
                .sidebar {
                    width: 250px;
                    background-color: var(--bg-dark);
                    border-right: 1px solid var(--border-color);
                    padding: 20px;
                    display: flex;
                    flex-direction: column;
                    flex-shrink: 0;
                }

                .logo {
                    font-size: 1.8rem;
                    font-weight: 800;
                    text-align: center;
                    margin-bottom: 40px;
                    color: white;
                    text-decoration: none;
                }
                .logo span { color: var(--brand-red); }

                .nav-menu { list-style: none; padding: 0; margin: 0; }

                .nav-link {
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    color: var(--text-gray);
                    text-decoration: none;
                    padding: 12px 15px;
                    border-radius: 6px;
                    font-weight: 600;
                    margin-bottom: 5px;
                    transition: all 0.2s;
                }
                .nav-link.active, .nav-link:hover {
                    background-color: var(--brand-red);
                    color: white;
                }
                .nav-link i { width: 20px; text-align: center; }

                .logout-section { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color); }
                .logout-button { width: 100%; background: none; border: none; text-align: left; padding: 12px 15px; border-radius: 6px; color: var(--text-gray); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 15px; font-family: inherit; font-size: 1rem; }
                .logout-button:hover { background-color: #444; color: white; }

                /* --- MAIN CONTENT --- */
                .main-content {
                    flex-grow: 1;
                    padding: 40px;
                    overflow-y: auto;
                }

                h1 {
                    border-left: 5px solid var(--brand-red);
                    padding-left: 15px;
                    margin-bottom: 30px;
                    font-size: 2rem;
                    text-transform: uppercase;
                }

                /* --- TABS --- */
                .tabs {
                    margin-bottom: 25px;
                    border-bottom: 1px solid var(--border-color);
                    display: flex;
                    gap: 10px;
                }
                .tab-link {
                    display: inline-block;
                    padding: 10px 20px 10px 0;
                    color: var(--text-gray);
                    text-decoration: none;
                    font-weight: 600;
                    font-size: 1rem;
                    border-bottom: 3px solid transparent;
                    margin-bottom: -1px;
                    transition: color 0.2s, border-color 0.2s;
                }
                .tab-link:hover { color: var(--text-white); }
                .tab-link.active { color: var(--brand-red); border-bottom-color: var(--brand-red); }

                /* --- TABLE STYLES --- */
                .table-wrapper {
                    background-color: var(--bg-dark);
                    border: 1px solid var(--border-color);
                    border-radius: 8px;
                    overflow: hidden;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                }

                .dashboard-table { width: 100%; border-collapse: collapse; }
                .dashboard-table th { text-align: left; padding: 15px; background-color: #2a2a2a; color: var(--text-gray); font-size: 0.8rem; text-transform: uppercase; }
                .dashboard-table td { padding: 15px; border-top: 1px solid var(--border-color); }
                .dashboard-table tbody tr:hover { background-color: #252525; }

                /* --- BADGES (FIXED COLORS) --- */
                .badge {
                    padding: 6px 12px;
                    border-radius: 4px;
                    font-size: 0.75rem;
                    font-weight: 700;
                    text-transform: uppercase;
                    border: 1px solid transparent;
                }

                .badge-REJECTED { background: rgba(220, 53, 69, 0.15); color: #dc3545; border-color: #dc3545; }
                .badge-RECEIVED { background: rgba(0, 123, 255, 0.15); color: #5aaaff; border-color: #007bff; }
                .badge-REFUNDED { background: rgba(40, 167, 69, 0.15); color: #28a745; border-color: #28a745; }

                /* --- BUTTON (FIXED STYLE) --- */
                .btn-action {
                    background: #444;
                    color: white;
                    padding: 8px 15px;
                    border-radius: 4px;
                    text-decoration: none;
                    font-size: 0.8rem;
                    font-weight: bold;
                    transition: background 0.2s;
                }
                .btn-action:hover {
                    background: var(--brand-red);
                }
    </style>
</head>
        <body>
        <div class="sidebar">
            <a href="/admin/dashboard" class="logo">PULSE<span>.</span> OM</a>
            <ul class="nav-menu">
                <li><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="/admin/orders" class="nav-link"><i class="fas fa-box-open"></i> Orders</a></li>
                <li><a href="/admin/returns" class="nav-link active"><i class="fas fa-undo"></i> Returns</a></li>
                <li><a href="/admin/support" class="nav-link"><i class="fas fa-life-ring"></i> Support</a></li>
            </ul>

            <div class="logout-section">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-button">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </div>
        </div>

        <div class="main-content">
            <h1>Manage Returns</h1>
        >
            <div class="tabs">
                <a href="/admin/returns" class="tab-link">Pending Approval</a>
                <a href="/admin/returns/approved" class="tab-link">Approved & Awaiting Item</a>
                <a href="/admin/returns/history" class="tab-link active">Completed & History</a>
            </div>

            <div class="table-wrapper">
                <table class="dashboard-table">
                    <thead>
                    <tr><th>Return ID</th><th>Order ID</th><th>Customer</th><th>Final Status</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="ret : ${returns}">
                        <td th:text="'#' + ${ret.id}"></td>
                        <td th:text="'#' + ${ret.order.id}"></td>
                        <td th:text="${ret.order.customer.email}"></td>
                        <td>
                                <span class="badge"
                                      th:classappend="'badge-' + ${ret.status}"
                                      th:text="${ret.status}"></span>
                        </td>
                        <td><a th:href="@{/admin/returns/manage/{id}(id=${ret.id})}" class="btn-action">View Details</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        </body>
        </html>
