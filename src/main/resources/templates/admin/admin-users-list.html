<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users | Pulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- Standard Pulse Admin Theme --- */
        :root { --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000; --text-white: #ffffff; --text-gray: #b3b3b3; --border-color: #333; }
        body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: var(--bg-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .logo { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 40px; }
        .logo span { color: var(--brand-red); }
        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-link { display: flex; align-items: center; gap: 15px; color: var(--text-gray); text-decoration: none; padding: 12px 15px; border-radius: 6px; font-weight: 600; margin-bottom: 5px; transition: all 0.2s; }
        .nav-link.active, .nav-link:hover { background-color: var(--brand-red); color: white; }
        .nav-link i { width: 20px; text-align: center; }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        h1 { font-size: 2rem; margin: 0; }
        .logout-section { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .logout-button { width: 100%; background: none; border: none; text-align: left; padding: 12px 15px; border-radius: 6px; color: var(--text-gray); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 15px; font-family: inherit; font-size: 1rem; }
        .logout-button:hover { background-color: #444; color: white; }

        /* --- ⭐️ NEW & IMPROVED STYLES ⭐️ --- */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--brand-red); color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; transition: background-color 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-add:hover { background-color: #990000; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; font-weight: 600; border: 1px solid transparent; }
        .alert-success { background-color: #0b4f32; border-color: #28a745; color: white; }
        .alert-danger { background-color: #5c0000; border-color: var(--brand-red); color: white; }
        .table-wrapper { background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .dashboard-table { width: 100%; border-collapse: collapse; }
        .dashboard-table th { text-align: left; padding: 15px 20px; background-color: #2a2a2a; font-size: 0.8rem; text-transform: uppercase; color: var(--text-gray); }
        .dashboard-table td { padding: 15px 20px; border-top: 1px solid var(--border-color); }
        .dashboard-table tbody tr:hover { background-color: #252525; }
        .role-text { font-weight: bold; color: var(--brand-red); text-transform: capitalize; }
        .btn-delete { background: #5c0000; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        .btn-delete:hover { background: var(--brand-red); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">PULSE<span>.</span> SA</div>
    <ul class="nav-menu">
        <li><a href="/admin/dashboard" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a></li>
        <li><a href="/admin/users" class="nav-link active"><i class="fas fa-users-cog"></i> User Management</a></li>
    </ul>
    <div class="logout-section">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="header-row">
        <h1>User Management</h1>
        <a href="/admin/users/create" class="btn-add"><i class="fas fa-plus"></i> Add New Admin</a>
    </div>

    <!-- ⭐️ FIXED: Properly styled alert boxes for feedback ⭐️ -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-wrapper">
        <table class="dashboard-table">
            <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.fName} + ' ' + ${user.lName}"></td>
                <td th:text="${user.email}"></td>
                <!-- ⭐️ FIXED: Formats the role to be clean and readable -->
                <td>
                    <span class="role-text" th:text="${user.role.replace('ROLE_', '').replace('_', ' ')}"></span>
                </td>
                <td>
                    <form th:action="@{/admin/users/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
                        <input type="hidden" name="userId" th:value="${user.userId}">
                        <button type="submit" class="btn-delete"><i class="fas fa-trash-alt"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
