<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>PULSE.PM – Product Form</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg-black: #121212;
      --bg-dark: #1e1e1e;
      --brand-red: #cc0000;
      --text-white: #ffffff;
      --text-gray: #b3b3b3;
      --border-color: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 250px;
      background-color: var(--bg-dark);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 40px;
    }
    .logo span { color: var(--brand-red); }
    .nav-menu { list-style: none; padding: 0; margin: 0; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--text-gray);
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 5px;
      transition: all 0.2s;
    }
    .nav-link.active,
    .nav-link:hover {
      background-color: var(--brand-red);
      color: #fff;
    }
    .nav-link i { width: 20px; text-align: center; }
    .logout-section {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .logout-button {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 12px 15px;
      border-radius: 6px;
      color: var(--text-gray);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logout-button:hover {
      background-color: #444;
      color: #fff;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px;
      overflow-y: auto;
    }
    h1 { margin: 0 0 8px 0; font-size: 2rem; }
    .page-subtitle {
      color: var(--text-gray);
      margin-bottom: 25px;
    }

    .form-card {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      max-width: 700px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 24px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 0.9rem; color: var(--text-gray); }
    input[type="text"],
    input[type="number"],
    select {
      background-color: #181818;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-white);
    }
    .form-actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      border-radius: 6px;
      padding: 10px 18px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background-color: var(--brand-red);
      color: #fff;
    }
    .btn-primary:hover { background-color: #e00000; }
    .btn-secondary {
      background-color: #333;
      color: var(--text-white);
    }
    .btn-secondary:hover { background-color: #444; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">PULSE<span>.</span> PM</div>
  <ul class="nav-menu">
    <li><a href="/admin/dashboard" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
    <li><a href="/admin/products" class="nav-link active"><i class="fas fa-tags"></i> Products</a></li>
    <li><a href="/admin/inventory" class="nav-link"><i class="fas fa-warehouse"></i> Inventory</a></li>
  </ul>
  <div class="logout-section">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="logout-button">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </form>
  </div>
</div>

<div class="main-content">
  <h1 th:text="${product.id} != null ? 'Edit Product' : 'Add Product'">Product</h1>
  <p class="page-subtitle">Update basic information and visibility.</p>

  <div class="form-card">
    <form th:action="@{/admin/products/save}"
          method="post"
          th:object="${product}">

      <!-- id + categoryId -->
      <input type="hidden" th:field="*{id}">
      <input type="hidden"
             name="categoryId"
             th:value="${product.category != null ? product.category.id : ''}">

      <div class="form-grid">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" th:field="*{name}" required>
        </div>

        <div class="form-group">
          <label for="price">Price (Rs)</label>
          <input id="price" type="number" step="0.01" min="0"
                 th:field="*{price}" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="categoryId" required>
            <option value="">Select category</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${product.category != null and product.category.id == cat.id}">
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="label">Label (e.g. Gaming, Classic)</label>
          <input id="label" type="text" th:field="*{label}">
        </div>
      </div> <!-- end form-grid -->

      <div class="form-actions">
        <a th:href="@{/admin/products}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i>
          <span>Save Product</span>
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
