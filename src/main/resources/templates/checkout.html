<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Pulse</title>
    <style>
        :root {
          --bg-black:#121212;
          --bg-dark:#1e1e1e;
          --card:#1b1b1b;
          --border:#2b2b2b;
          --brand-red:#cc0000;
          --text-white:#ffffff;
          --text-gray:#b3b3b3;
        }
        *{box-sizing:border-box;}
        body{
          margin:0;
          font-family:'Segoe UI',sans-serif;
          background:#121212;
          color:var(--text-white);
        }
        .page{
          max-width:1200px;
          margin:80px auto 40px;
          padding:0 20px 40px;
          display:grid;
          grid-template-columns:2fr 1.5fr;
          gap:25px;
        }
        .card{
          background:var(--card);
          border-radius:14px;
          border:1px solid var(--border);
          padding:20px 20px 25px;
          box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }
        h1,h2{margin:0 0 20px;}
        .label{
          font-size:0.8rem;
          text-transform:uppercase;
          color:var(--text-gray);
          margin-bottom:4px;
        }
        .value{
          font-size:1rem;
          margin-bottom:8px;
        }
        .summary-row{
          display:flex;
          justify-content:space-between;
          margin-bottom:8px;
          font-size:0.9rem;
          color:var(--text-gray);
        }
        .summary-row.total{
          margin-top:10px;
          padding-top:10px;
          border-top:1px dashed var(--border);
          color:#fff;
          font-weight:700;
        }
        select{
          width:100%;
          padding:10px;
          margin-bottom:12px;
          border-radius:8px;
          border:1px solid var(--border);
          background:#111;
          color:#fff;
          outline:none;
        }
        .btn-primary{
          width:100%;
          margin-top:10px;
          padding:13px 0;
          border-radius:999px;
          border:none;
          background:linear-gradient(135deg,#ffffff,#e3e3e3);
          color:#000;
          font-weight:700;
          text-transform:uppercase;
          letter-spacing:1px;
          cursor:pointer;
        }
        .btn-primary:hover{filter:brightness(0.95);}
        @media(max-width:900px){
          .page{grid-template-columns:1fr;}
        }

        /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page">

    <!-- LEFT: Delivery + payment -->
    <div class="card">
        <h1>Review &amp; Payment</h1>

        <div>
            <div class="label">Deliver To</div>
            <div class="value" th:text="${delivery.firstName} + ' ' + ${delivery.lastName}">Name</div>
            <div class="value" th:text="${delivery.addressLine}">Address</div>
            <div class="value" th:text="${delivery.city} + ', ' + ${delivery.country}">City</div>
            <div class="value" th:text="${delivery.phone}">Phone</div>
        </div>

        <hr style="border:0;border-top:1px solid var(--border);margin:15px 0;">

        <form th:action="@{/order/place}" method="post">
            <input type="hidden" name="deliveryId" th:value="${delivery.id}">

            <label class="label">Payment Method</label>
            <select name="paymentMethod">
                <option value="COD"
                        th:selected="${paymentMethod == 'COD'}">Cash on Delivery</option>
                <option value="CARD"
                        th:selected="${paymentMethod == 'CARD'}">Card (mock)</option>
            </select>

            <button type="submit" class="btn-primary">Confirm Order</button>
        </form>

    </div>

    <!-- RIGHT: Order summary -->
    <div class="card" th:if="${cart != null}">
        <h2>Order Summary</h2>

        <div th:each="item : ${cart.cartItems}" class="summary-row">
            <span th:text="${item.variant.product.name} + ' x ' + ${item.quantity}">Item</span>
            <span th:text="'Rs. ' + ${item.variant.product.price * item.quantity}">0</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span th:text="'Rs. ' + ${totalPrice}">0</span>
        </div>

    </div>

</div>

</body>
</html>
