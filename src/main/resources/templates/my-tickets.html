<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title> Support Inbox | Pulse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000; --text-white: #ffffff; --border: #333; }
    body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 40px auto; }

    h1 { border-left: 6px solid var(--brand-red); padding-left: 15px; text-transform: uppercase; margin-bottom: 30px; }

    .ticket-card {
        background-color: var(--bg-dark); border: 1px solid var(--border);
        border-radius: 8px; padding: 20px; margin-bottom: 15px;
        display: flex; justify-content: space-between; align-items: center;
    }

    .ticket-info h4 { margin: 0 0 5px 0; font-size: 1.1rem; }
    .ticket-meta { font-size: 0.85rem; color: #888; }

    .badge { padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .status-OPEN { background: #007bff; color: white; }
    .status-IN_PROGRESS { background: #ffc107; color: black; }
    .status-RESOLVED { background: #28a745; color: white; }
    .status-REJECTED { background: #dc3545; color: white; }

    /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>My Support Inbox</h1>
    <p class="subtitle">Track your returns and support messages.</p>
    <a href="/support/create" class="btn" style="color: var(--brand-red); border: 1px solid var(--brand-red); padding: 8px 15px; text-decoration: none; border-radius: 4px;">+ New Inquiry</a>
  </div>

  <div th:if="${not #lists.isEmpty(tickets)}">
    <div th:each="ticket : ${tickets}" class="ticket-card">
      <div class="ticket-info">
        <h4 th:text="${ticket.subject}">Subject</h4>
        <div class="ticket-meta">
          <span th:text="${ticket.type}">TYPE</span> |
          <span th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy')}">Date</span>
          <span th:if="${ticket.order != null}" th:text="' | Order #' + ${ticket.order.id}"></span>
        </div>
      </div>
      <div>
                <span class="badge"
                      th:classappend="'status-' + ${ticket.status}"
                      th:text="${ticket.status}">OPEN</span>
      </div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(tickets)}" style="text-align: center; color: #666; margin-top: 50px;">
    <p>No support tickets found.</p>
  </div>
</div>

</body>
</html>
