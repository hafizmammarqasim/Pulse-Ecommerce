<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Received | Pulse</title>
    <style>
        /* --- PULSE THEME VARIABLES --- */
        :root {
            --bg-black: #121212;
            --bg-dark: #1e1e1e;
            --bg-card: #252525;
            --brand-red: #cc0000;
            --brand-green: #28a745;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: rgba(40, 167, 69, 0.1); /* Transparent Green */
            border: 2px solid var(--brand-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
        }

        .check-mark {
            color: var(--brand-green);
            font-size: 2.5rem;
            font-weight: bold;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-box {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 30px;
            border-left: 4px solid var(--brand-red);
            text-align: left;
        }

        .info-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .info-val {
            font-weight: bold;
            color: white;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-primary {
            background-color: var(--brand-red);
            color: white;
            padding: 15px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn-primary:hover { background-color: #aa0000; }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-gray);
            padding: 10px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-secondary:hover { color: white; text-decoration: underline; }

    </style>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="content-wrapper">
    <div class="success-card">

        <div class="icon-circle">
            <span class="check-mark">✓</span>
        </div>

        <h1>Request Submitted</h1>

        <p>
            We have received your return request. Our support team will review it shortly.
            You can track the status of this request in your support tickets.
        </p>

        <div class="info-box">
            <span class="info-label">What happens next?</span>
            <span class="info-val">If approved, you will receive shipping instructions via email within 24 hours.</span>
        </div>

        <div class="btn-group">
            <a href="/" class="btn-secondary">Return to Home</a>
        </div>

    </div>
</div>

</body>
</html>
