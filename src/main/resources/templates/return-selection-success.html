<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Received | Pulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- PULSE THEME VARIABLES --- */
        :root {
            --bg-black: #121212;
            --bg-dark: #1e1e1e;
            --bg-card: #252525;
            --brand-red: #cc0000;
            --brand-green: #28a745;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: rgba(40, 167, 69, 0.1); /* Transparent Green */
            border: 2px solid var(--brand-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
        }

        .check-mark {
            color: var(--brand-green);
            font-size: 2.5rem;
            font-weight: bold;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-box {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 30px;
            border-left: 4px solid var(--brand-red);
            text-align: left;
        }

        .info-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .info-val {
            font-weight: bold;
            color: white;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-primary {
            background-color: var(--brand-red);
            color: white;
            padding: 15px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn-primary:hover { background-color: #aa0000; }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-gray);
            padding: 10px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-secondary:hover { color: white; text-decoration: underline; }

        /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="content-wrapper">
    <div class="success-card">

        <div class="icon-circle">
            <span class="check-mark">✓</span>
        </div>

        <h1>Request Submitted</h1>

        <p>
            We have received your return request. Our support team will review it shortly.
            You can track the status of this request in your support tickets.
        </p>

        <div class="info-box">
            <span class="info-label">What happens next?</span>
            <span class="info-val">If approved, you will receive shipping instructions via email within 24 hours.</span>
        </div>

        <div class="btn-group">
            <a href="/" class="btn-secondary">Return to Home</a>
        </div>

    </div>
</div>

</body>
</html>
