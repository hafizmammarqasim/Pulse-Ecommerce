<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pulse | Home</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* --- GLOBAL VARIABLES --- */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       ⭐️ NAVBAR STYLES (Added so Home can style the fragment) ⭐️
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%; padding: 12px 15px; border: none; background: none; outline: none; color: var(--text-white); font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red); color: white; border: none; padding: 0 20px; cursor: pointer; font-size: 1.1rem;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    .navbar-actions { display: flex; gap: 20px; align-items: center; margin-left: 30px; }
    .nav-link {
        color: var(--text-gray); text-decoration: none; font-size: 1rem; font-weight: 600; padding: 8px 12px; border-radius: 4px; transition: 0.2s;
    }
    .nav-link:hover { color: var(--text-white); background-color: #2a2a2a; }
    .nav-link.icon { font-size: 1.3rem; }

    .btn-login {
        background-color: var(--brand-red); color: var(--text-white); text-decoration: none; font-size: 1rem; font-weight: 700; padding: 8px 16px; border-radius: 4px;
    }
    .btn-login:hover { background-color: #aa0000; }
    .btn-logout {
        background: none; border: none; color: var(--text-gray); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 12px; font-family: inherit;
    }
    .btn-logout:hover { color: var(--text-white); background-color: #2a2a2a; }


    /* =========================================
       PAGE CONTENT STYLES
       ========================================= */
    /* BANNER */
    .banner-container { width: 100%; line-height: 0; }
    .banner-container img { width: 100%; height: auto; object-fit: cover; }

    /* LAYOUT */
    .container { padding: 40px; max-width: 1400px; margin: 0 auto; }

    /* CATEGORY STRIP */
    .cat-strip-wrap{ border-bottom: 1px solid var(--border-color); margin-bottom: 40px; }
    .cat-strip{ padding: 10px 0; display: flex; gap: 12px; overflow-x: auto; }
    .cat-strip::-webkit-scrollbar{ height: 6px; }
    .cat-strip::-webkit-scrollbar-thumb{ background: var(--brand-red); border-radius: 6px; }
    .cat-pill{
        display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 999px; border: 1px solid #444; color: var(--text-gray);
        text-decoration: none; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; font-size: .85rem; transition: .2s; white-space: nowrap;
    }
    .cat-pill:hover{ border-color: var(--brand-red); color: var(--brand-red); }
    .cat-pill.active{ background: var(--brand-red); border-color: var(--brand-red); color: var(--text-white); }

    /* PRODUCTS */
    .category-title {
        font-size: 2em; margin-bottom: 20px; padding-left: 15px; border-left: 8px solid var(--brand-red);
        text-transform: uppercase; font-weight: 900; letter-spacing: 1px; color: var(--text-white);
    }
    .category-section { margin-bottom: 70px; }
    .product-slider { display: flex; gap: 30px; overflow-x: auto; padding-bottom: 20px; padding-left: 5px; scroll-behavior: smooth; }
    .product-slider::-webkit-scrollbar { height: 8px; }
    .product-slider::-webkit-scrollbar-track { background: #222; border-radius: 4px; }
    .product-slider::-webkit-scrollbar-thumb { background-color: var(--brand-red); border-radius: 4px; }

    .product-card {
        background-color: var(--bg-dark); border: 1px solid var(--border-color); min-width: 320px; max-width: 320px;
        border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); border-color: var(--brand-red); }
    .card-image-container { width: 100%; height: 250px; background-color: #fff; display: flex; justify-content: center; align-items: center; padding: 20px; border-bottom: 1px solid var(--border-color); }
    .card-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.4s ease; }
    .product-card:hover .card-image-container img { transform: scale(1.1); }
    .card-content { padding: 25px; text-align: center; }
    .product-name { font-size: 1.3em; font-weight: 700; color: var(--text-white); margin: 0 0 10px 0; line-height: 1.3; height: 55px; overflow: hidden; }
    .product-price { color: var(--brand-red); font-size: 1.5em; font-weight: 800; margin-bottom: 5px; display: block; }
    .view-btn {
        background-color: var(--brand-red); color: white; text-align: center; padding: 15px; font-size: 1em; font-weight: 700;
        text-transform: uppercase; text-decoration: none; display: block; margin: 0 25px 25px 25px; border-radius: 6px; transition: background 0.3s; letter-spacing: 1px;
    }
    .view-btn:hover { background-color: #aa0000; }
    .empty-msg { color: var(--text-gray); font-style: italic; padding: 20px; font-size: 1.1em; }
  </style>
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- BANNER SECTION -->
<div class="banner-container">
  <img th:src="@{/images/banner.png}" alt="Pulse promotional banner">
</div>

<!-- MAIN CONTENT -->
<div class="container">

  <!-- CATEGORY STRIP -->
  <div class="cat-strip-wrap">
    <div class="cat-strip">
      <a class="cat-pill" th:classappend="${selectedCategory == null} ? 'active'" th:href="@{/}">All</a>
      <a class="cat-pill" th:classappend="${selectedCategory == 'earbuds'} ? 'active'" th:href="@{/(category='earbuds')}">Earbuds</a>
      <a class="cat-pill" th:classappend="${selectedCategory == 'headphones'} ? 'active'" th:href="@{/(category='headphones')}">Headphones</a>
      <a class="cat-pill" th:classappend="${selectedCategory == 'speakers'} ? 'active'" th:href="@{/(category='speakers')}">Speakers</a>
      <a class="cat-pill" th:classappend="${selectedCategory == 'watches'} ? 'active'" th:href="@{/(category='watches')}">Watches</a>
      <a class="cat-pill" th:classappend="${selectedCategory == 'powerbanks'} ? 'active'" th:href="@{/(category='powerbanks')}">Power Banks</a>
    </div>
  </div>

  <!-- 1. EARBUDS -->
  <div class="category-section" th:if="${selectedCategory == null or selectedCategory == 'earbuds'}">
    <div class="category-title">Earbuds</div>
    <div class="product-slider">
      <div class="product-card" th:each="product : ${earbudsList}">
        <div class="card-image-container"><img th:src="@{/images/tempImage.avif}" alt="Product Image"></div>
        <div class="card-content">
          <div class="product-name" th:text="${product.name}"></div>
          <span class="product-price" th:text="'Rs. ' + ${product.price}"></span>
        </div>
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
      </div>
      <p class="empty-msg" th:if="${#lists.isEmpty(earbudsList)}">No Earbuds available.</p>
    </div>
  </div>

  <!-- 2. HEADPHONES -->
  <div class="category-section" th:if="${selectedCategory == null or selectedCategory == 'headphones'}">
    <div class="category-title">Headphones</div>
    <div class="product-slider">
      <div class="product-card" th:each="product : ${headPhonesList}">
        <div class="card-image-container"><img th:src="@{/images/tempImage.avif}" alt="Product Image"></div>
        <div class="card-content">
          <div class="product-name" th:text="${product.name}"></div>
          <span class="product-price" th:text="'Rs. ' + ${product.price}"></span>
        </div>
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
      </div>
      <p class="empty-msg" th:if="${#lists.isEmpty(headPhonesList)}">No Headphones available.</p>
    </div>
  </div>

  <!-- 3. SPEAKERS -->
  <div class="category-section" th:if="${selectedCategory == null or selectedCategory == 'speakers'}">
    <div class="category-title">Speakers</div>
    <div class="product-slider">
      <div class="product-card" th:each="product : ${speakersList}">
        <div class="card-image-container"><img th:src="@{/images/tempImage.avif}" alt="Product Image"></div>
        <div class="card-content">
          <div class="product-name" th:text="${product.name}"></div>
          <span class="product-price" th:text="'Rs. ' + ${product.price}"></span>
        </div>
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
      </div>
      <p class="empty-msg" th:if="${#lists.isEmpty(speakersList)}">No Speakers available.</p>
    </div>
  </div>

  <!-- 4. WATCHES -->
  <div class="category-section" th:if="${selectedCategory == null or selectedCategory == 'watches'}">
    <div class="category-title">Smart Watches</div>
    <div class="product-slider">
      <div class="product-card" th:each="product : ${watchList}">
        <div class="card-image-container"><img th:src="@{/images/tempImage.avif}" alt="Product Image"></div>
        <div class="card-content">
          <div class="product-name" th:text="${product.name}"></div>
          <span class="product-price" th:text="'Rs. ' + ${product.price}"></span>
        </div>
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
      </div>
      <p class="empty-msg" th:if="${#lists.isEmpty(watchList)}">No Watches available.</p>
    </div>
  </div>

  <!-- 5. POWER BANKS -->
  <div class="category-section" th:if="${selectedCategory == null or selectedCategory == 'powerbanks'}">
    <div class="category-title">Power Banks</div>
    <div class="product-slider">
      <div class="product-card" th:each="product : ${powerBankList}">
        <div class="card-image-container"><img th:src="@{/images/tempImage.avif}" alt="Product Image"></div>
        <div class="card-content">
          <div class="product-name" th:text="${product.name}"></div>
          <span class="product-price" th:text="'Rs. ' + ${product.price}"></span>
        </div>
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="view-btn">View Details</a>
      </div>
      <p class="empty-msg" th:if="${#lists.isEmpty(powerBankList)}">No Power Banks available.</p>
    </div>
  </div>

</div>

</body>
</html>
