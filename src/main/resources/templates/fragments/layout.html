<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" style="
    background-color: #000000;
    color: white;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid #cc0000;
    font-family: sans-serif;">

    <!-- Logo -->
    <a th:href="@{/}" style="
        text-decoration: none;
        font-size: 2em;
        font-weight: 900;
        color: white;
        text-transform: uppercase;
        letter-spacing: 1px;">
        PULSE<span style="color: #cc0000;">.</span>
    </a>

    <!-- Search -->
    <form th:action="@{/search}" method="get" style="
        display: flex;
        flex-grow: 1;
        max-width: 500px;
        margin: 0 20px;">
        <input type="text" name="query" placeholder="Search for products..." style="
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;">
        <button type="submit" style="
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;">
            Search
        </button>
    </form>

    <!-- RIGHT SIDE: LINKS -->
    <div style="display: flex; gap: 20px; align-items: center;">

        <a th:href="@{/}" style="
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;">
            Home
        </a>

        <!-- Cart link -->
        <a th:href="@{/cart/view}" style="
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;">
            🛒 Cart
        </a>

        <a th:href="@{/login}" style="
            color: #cc0000;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 700;">
            Login
        </a>
    </div>

</nav>

</body>
</html>
