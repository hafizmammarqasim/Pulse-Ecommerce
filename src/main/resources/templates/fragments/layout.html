<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- This fragment contains ONLY the navbar structure -->
<nav th:fragment="navbar" class="navbar">
    <!-- Logo -->
    <a th:href="@{/}" class="navbar-logo">
        PULSE<span>.</span>
    </a>

    <!-- Search Bar -->
    <form th:action="@{/search}" method="get" class="navbar-search">
        <input type="text" name="query" placeholder="Search for products...">
        <button type="submit"><i class="fas fa-search"></i></button>
    </form>

    <!-- Navigation Links -->
    <div class="navbar-actions">
        <a th:href="@{/}" class="nav-link">Home</a>
        <a th:href="@{/order/view}" class="nav-link">Orders</a>
        <a th:href="@{/support/my-tickets}" class="nav-link">Support</a>

        <a th:href="@{/cart/view}" class="nav-link icon" title="View Cart">
            <i class="fas fa-shopping-cart"></i>
        </a>

        <!-- Authenticated: Logout -->
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>

        <!-- Anonymous: Login -->
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn-login">Login</a>
        </div>
    </div>
</nav>

</body>
</html>
