<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pulse</title>
  <style>
    /* --- PULSE RED/BLACK THEME --- */
    :root {
        --primary-black: #121212;
        --secondary-black: #1e1e1e;
        --primary-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
        --input-bg: #2a2a2a;
    }

    /* 1. RESET & BASE STYLES */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--primary-black);
        color: var(--text-white);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* Full screen height */
    }

    /* 2. THE CARD CONTAINER */
    .login-container {
        background-color: var(--secondary-black);
        padding: 3rem; /* 48px */
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Stronger shadow for dark mode */
        border: 1px solid var(--border-color);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    /* 3. TYPOGRAPHY UPDATES */
    .login-header {
        margin-bottom: 2.5rem; /* More space between header and inputs */
    }

    .brand-name {
        font-size: 3rem; /* Made Logo slightly bigger */
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-white);
        display: block;
        margin-bottom: 10px; /* Space between Logo and Welcome text */
        line-height: 1;
    }

    .brand-name span {
        color: var(--primary-red);
    }

    .login-header p {
        color: #cccccc; /* Much lighter gray, almost white */
        font-size: 1.2rem; /* Increased size significantly */
        font-weight: 500; /* Made it slightly thicker */
        letter-spacing: 0.5px;
    }

    /* 4. FORM ELEMENTS */
    .form-group {
        margin-bottom: 1.5rem;
    }

    input {
        width: 100%;
        padding: 14px 15px;
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        color: var(--text-white);
        border-radius: 4px; /* Sharper corners match tech vibe */
        font-size: 1rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        outline: none;
    }

    input::placeholder {
        color: #666;
    }

    /* Glow effect on focus (Red) */
    input:focus {
        border-color: var(--primary-red);
        box-shadow: 0 0 0 2px rgba(204, 0, 0, 0.2);
    }

    /* 5. BUTTON */
    button {
        width: 100%;
        padding: 14px;
        background-color: var(--primary-red);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        margin-top: 10px;
    }

    button:hover {
        background-color: #aa0000; /* Darker Red on hover */
    }

    button:active {
        transform: scale(0.98);
    }

        .footer-link {
        margin-top: 30px; /* Pushes it further down from the button */
        font-size: 1rem;  /* Increased from 0.9rem */
        color: #999;      /* Lighter gray for better readability */
    }

    .footer-link a {
        color: var(--primary-red);
        text-decoration: none;
        font-weight: 700; /* Bold link to make it stand out */
        margin-left: 5px; /* Tiny space after the question mark */
        transition: color 0.2s;
    }

    .footer-link a:hover {
        color: #ff4d4d; /* Brighter red on hover */
        text-decoration: underline;
    }

  </style>
</head>
<body>

<div class="login-container">

  <div class="login-header">
    <div class="brand-name">Pulse<span>.</span></div>
    <p>Welcome back</p>
  </div>

  <!-- ERROR MESSAGE BLOCK -->
  <div th:if="${param.error}" class="alert alert-error">
    Invalid username or password.
  </div>

  <!-- LOGOUT MESSAGE BLOCK -->
  <div th:if="${param.logout}" class="alert alert-logout">
    You have been logged out.
  </div>

  <!-- REGISTRATION SUCCESS BLOCK -->
  <div th:if="${param.registrationSuccess}" class="alert alert-success">
    Account Created Successfully
  </div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <input type="text" name="username" placeholder="Email or Phone Number" required autofocus>
    </div>

    <div class="form-group">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit">Sign In</button>
  </form>

  <div class="footer-link">
    New to Pulse? <a href="/register">Create Account</a>
  </div>
</div>

</body>
</html>
