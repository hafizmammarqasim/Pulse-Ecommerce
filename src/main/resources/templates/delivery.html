<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delivery Details | Pulse</title>
    <style>
        :root {
          --bg-black:#121212;
          --bg-dark:#1e1e1e;
          --card:#1b1b1b;
          --border:#2b2b2b;
          --brand-red:#cc0000;
          --text-white:#ffffff;
          --text-gray:#b3b3b3;
        }
        *{box-sizing:border-box;}
        body{
          margin:0;
          font-family:'Segoe UI',sans-serif;
          background:#121212;
          color:var(--text-white);
        }
        .page{
          max-width:1200px;
          margin:80px auto 40px;
          padding:0 20px 40px;
          display:grid;
          grid-template-columns:2fr 1.5fr;
          gap:25px;
        }
        .card{
          background:var(--card);
          border-radius:14px;
          border:1px solid var(--border);
          padding:20px 20px 25px;
          box-shadow:0 20px 40px rgba(0,0,0,0.4);
        }
        h1,h2{margin:0 0 20px;}
        label{
          display:block;
          font-size:0.8rem;
          text-transform:uppercase;
          color:var(--text-gray);
          margin-bottom:4px;
        }
        input,textarea{
          width:100%;
          padding:10px;
          margin-bottom:12px;
          border-radius:8px;
          border:1px solid var(--border);
          background:#111;
          color:#fff;
          outline:none;
        }
        textarea{resize:vertical;min-height:70px;}
        .row{display:flex;gap:12px;}
        .btn-primary{
          width:100%;
          margin-top:10px;
          padding:13px 0;
          border-radius:999px;
          border:none;
          background:linear-gradient(135deg,#ffffff,#e3e3e3);
          color:#000;
          font-weight:700;
          text-transform:uppercase;
          letter-spacing:1px;
          cursor:pointer;
        }
        .btn-primary:hover{filter:brightness(0.95);}
        .summary-row{
          display:flex;
          justify-content:space-between;
          margin-bottom:8px;
          font-size:0.9rem;
          color:var(--text-gray);
        }
        .summary-row.total{
          margin-top:10px;
          padding-top:10px;
          border-top:1px dashed var(--border);
          color:#fff;
          font-weight:700;
        }
        .saved-address{
          border:1px solid var(--border);
          border-radius:10px;
          padding:10px 12px;
          margin-bottom:8px;
          cursor:pointer;
          background:#181818;
          font-size:0.9rem;
        }
        .saved-address:hover{
          border-color:var(--brand-red);
        }
        @media(max-width:900px){
          .page{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page">

    <!-- LEFT: Delivery form -->
    <div class="card">
        <h1>Delivery Details</h1>

        <!-- Saved addresses -->
        <div th:if="${savedDeliveries != null and !#lists.isEmpty(savedDeliveries)}">
            <h3 style="margin-top:0; margin-bottom:10px; font-size:1rem; color:var(--text-gray);">
                Saved Addresses
            </h3>
            <div th:each="d : ${savedDeliveries}" class="saved-address">
                <div th:text="${d.firstName} + ' ' + ${d.lastName}">Name</div>
                <div th:text="${d.addressLine} + ', ' + ${d.city}">Address</div>
                <div th:text="${d.phone}">Phone</div>
            </div>
            <hr style="border:0;border-top:1px solid var(--border);margin:15px 0;">
        </div>

        <form th:action="@{/order/delivery}" method="post" th:object="${delivery}">
            <div class="row">
                <div style="flex:1;">
                    <label>First Name</label>
                    <input th:field="*{firstName}" required>
                </div>
                <div style="flex:1;">
                    <label>Last Name</label>
                    <input th:field="*{lastName}" required>
                </div>
            </div>

            <label>Phone</label>
            <input th:field="*{phone}" required>

            <label>Country</label>
            <input th:field="*{country}" value="Pakistan" required>

            <label>Address Line</label>
            <textarea th:field="*{addressLine}" required></textarea>

            <label>Apartment (optional)</label>
            <input th:field="*{apartment}">

            <div class="row">
                <div style="flex:1;">
                    <label>City</label>
                    <input th:field="*{city}" required>
                </div>
                <div style="flex:1;">
                    <label>Postal Code</label>
                    <input th:field="*{postalCode}">
                </div>
            </div>

            <button type="submit" class="btn-primary">Continue to Checkout</button>
        </form>
    </div>

    <!-- RIGHT: Order summary from cart -->
    <div class="card" th:if="${cart != null}">
        <h2>Order Summary</h2>

        <div th:each="item : ${cart.cartItems}" class="summary-row">
            <span th:text="${item.variant.product.name} + ' x ' + ${item.quantity}">Item</span>
            <span th:text="'Rs. ' + ${item.variant.product.price * item.quantity}">0</span>
        </div>

        <div th:with="total=0">
            <div th:each="item : ${cart.cartItems}"
                 th:with="line=${item.variant.product.price * item.quantity},
                    total=${total + line}">
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span th:text="'Rs. ' + ${total}">0</span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
