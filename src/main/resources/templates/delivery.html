<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delivery Details | Pulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* =========================================
           1. GLOBAL & NAVBAR STYLES
           ========================================= */
        :root {
            --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000;
            --text-white: #ffffff; --text-gray: #b3b3b3; --border-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-black); color: var(--text-white);
            overflow-x: hidden;
        }

        /* NAVBAR (Required for fragment styling) */
        .navbar {
            background-color: var(--bg-dark); color: var(--text-white);
            padding: 15px 40px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
        }
        .navbar-logo { text-decoration: none; font-size: 1.8em; font-weight: 900; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; margin-right: 30px; }
        .navbar-logo span { color: var(--brand-red); }
        .navbar-search { display: flex; flex-grow: 1; max-width: 600px; background-color: #2a2a2a; border-radius: 6px; border: 1px solid var(--border-color); overflow: hidden; }
        .navbar-search input { width: 100%; padding: 12px 15px; border: none; background: none; outline: none; color: var(--text-white); font-size: 1rem; }
        .navbar-search button { background-color: var(--brand-red); color: white; border: none; padding: 0 20px; cursor: pointer; font-size: 1.1rem; }
        .navbar-actions { display: flex; gap: 20px; align-items: center; margin-left: 30px; }
        .nav-link { color: var(--text-gray); text-decoration: none; font-size: 1rem; font-weight: 600; padding: 8px 12px; border-radius: 4px; transition: 0.2s; }
        .nav-link:hover { color: var(--text-white); background-color: #2a2a2a; }
        .nav-link.icon { font-size: 1.3rem; }
        .btn-logout { background: none; border: none; color: var(--text-gray); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 12px; font-family: inherit; }
        .btn-logout:hover { color: var(--text-white); background-color: #2a2a2a; }

        /* =========================================
           2. PAGE LAYOUT
           ========================================= */
        .container {
            max-width: 1200px; margin: 50px auto; padding: 20px;
            display: grid; grid-template-columns: 2fr 1fr; gap: 40px;
        }

        h2 { border-left: 5px solid var(--brand-red); padding-left: 15px; margin-bottom: 30px; margin-top: 0; }

        /* =========================================
           3. ADDRESS CARDS (Selection UI)
           ========================================= */
        .address-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .address-option input[type="radio"] { display: none; } /* Hide radio circle */

        .address-card {
            background-color: var(--bg-dark); border: 2px solid var(--border-color);
            border-radius: 8px; padding: 20px; cursor: pointer; transition: 0.2s;
            position: relative; min-height: 120px; display: flex; flex-direction: column; justify-content: center;
        }
        .address-card:hover { border-color: #666; }

        /* Selected State */
        .address-option input[type="radio"]:checked + .address-card {
            border-color: var(--brand-red); background-color: rgba(204, 0, 0, 0.05);
        }
        .check-icon { position: absolute; top: 10px; right: 10px; color: var(--brand-red); opacity: 0; transition: 0.2s; }
        .address-option input[type="radio"]:checked + .address-card .check-icon { opacity: 1; }

        .addr-name { font-weight: 800; font-size: 1.1rem; margin-bottom: 5px; display: block; color: white;}
        .addr-text { font-size: 0.9rem; color: var(--text-gray); line-height: 1.4; }

        .address-card.new { align-items: center; border-style: dashed; color: var(--brand-red); font-weight: 700; text-transform: uppercase; }

        /* =========================================
           4. FORM STYLES
           ========================================= */
        #new-address-form {
            display: none; /* JS toggles this */
            background: var(--bg-dark); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-gray); margin-bottom: 4px; margin-top: 15px;}
        input, textarea, select {
            width: 100%; padding: 12px; margin-bottom: 5px; border-radius: 8px;
            border: 1px solid var(--border-color); background: #2a2a2a; color: #fff; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--brand-red); }
        textarea { resize: vertical; min-height: 70px; }

        .row { display: flex; gap: 12px; }

        /* =========================================
           5. SUMMARY & BUTTONS
           ========================================= */
        .summary-card { background-color: var(--bg-dark); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); position: sticky; top: 20px; }
        .summary-title { text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; margin-top: 0; font-weight: 700; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-gray); font-size: 0.9rem; }

        .total-row { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #444; font-size: 1.5rem; font-weight: 800; color: white; }

        .btn-confirm {
            width: 100%; background: var(--brand-red); color: white; padding: 15px; border: none;
            border-radius: 6px; font-weight: 800; text-transform: uppercase; margin-top: 25px; cursor: pointer; transition: 0.2s;
        }
        .btn-confirm:hover { background: #aa0000; }

    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <!-- LEFT: SELECTION & FORM -->
    <div class="checkout-left">
        <h2>Select Delivery Address</h2>

        <!-- MAIN FORM -->
        <form id="deliveryForm" th:action="@{/order/delivery}" method="post" th:object="${delivery}">

            <!-- 1. ADDRESS CARDS -->
            <div class="address-grid">

                <!-- LOOP Existing Addresses -->
                <label class="address-option" th:each="addr, iterStat : ${savedDeliveries}">
                    <input type="radio" name="selectedDeliveryId"
                           th:value="${addr.id}"
                           onclick="toggleForm(false)"
                           th:checked="${iterStat.index == 0}">

                    <div class="address-card">
                        <i class="fas fa-check-circle check-icon"></i>
                        <span class="addr-name" th:text="${addr.firstName} + ' ' + ${addr.lastName}">Name</span>
                        <div class="addr-text">
                            <span th:text="${addr.addressLine}">Address</span>,
                            <span th:text="${addr.city}">City</span>
                            <br><span th:text="${addr.phone}">Phone</span>
                        </div>
                    </div>
                </label>

                <!-- ADD NEW Option -->
                <label class="address-option">
                    <input type="radio" name="selectedDeliveryId" value="0"
                           onclick="toggleForm(true)"
                           th:checked="${#lists.isEmpty(savedDeliveries)}">

                    <div class="address-card new">
                        <i class="fas fa-plus-circle" style="font-size: 1.5rem; margin-bottom: 10px;"></i>
                        Add New Address
                    </div>
                </label>
            </div>

            <!-- 2. NEW ADDRESS INPUTS -->
            <div id="new-address-form">
                <h3 style="margin-top:0; margin-bottom:20px; color:white;">New Shipping Details</h3>

                <div class="row">
                    <div style="flex:1;">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" placeholder="First Name">
                    </div>
                    <div style="flex:1;">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" placeholder="Last Name">
                    </div>
                </div>

                <label>Phone</label>
                <input type="text" th:field="*{phone}" placeholder="0300-1234567">

                <label>Country</label>
                <input type="text" th:field="*{country}" value="Pakistan">

                <label>Address Line</label>
                <textarea th:field="*{addressLine}" placeholder="House #, Street, Area"></textarea>

                <label>Apartment (optional)</label>
                <input type="text" th:field="*{apartment}" placeholder="Apartment, Suite, etc.">

                <div class="row">
                    <div style="flex:1;">
                        <label>City</label>
                        <input type="text" th:field="*{city}" placeholder="City">
                    </div>
                    <div style="flex:1;">
                        <label>Postal Code</label>
                        <input type="text" th:field="*{postalCode}" placeholder="Postal Code">
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- RIGHT: ORDER SUMMARY -->
    <div class="summary-card" th:if="${cart != null}">
        <div class="summary-title">Order Summary</div>

        <div th:each="item : ${cart.cartItems}" class="summary-row">
            <span th:text="${item.variant.product.name} + ' (x' + ${item.quantity} + ')'">Product</span>
            <!-- FIXED Price Calculation -->
            <span th:text="'Rs. ' + ${item.variant.product.price * item.quantity}">Rs. 0</span>
        </div>

        <div class="total-row">
            <span>Total</span>
            <span style="color: var(--brand-red);" th:text="'Rs. ' + ${totalPrice}">Rs. 0</span>
        </div>

        <button class="btn-confirm" onclick="document.getElementById('deliveryForm').submit()">
            Continue to Checkout
        </button>
    </div>

</div>

<!-- JAVASCRIPT LOGIC -->
<script>
    function toggleForm(show) {
        const formDiv = document.getElementById('new-address-form');
        const inputs = formDiv.querySelectorAll('input, textarea');

        if (show) {
            formDiv.style.display = 'block';
            inputs.forEach(i => {
                // Only require if it's NOT apartment
                if(i.name !== 'apartment') i.required = true;
                i.disabled = false;
            });
        } else {
            formDiv.style.display = 'none';
            inputs.forEach(i => { i.disabled = true; i.required = false; });
        }
    }

    // Run on load to handle initial state
    window.onload = function() {
        const newAddrRadio = document.querySelector('input[value="0"]');
        if (newAddrRadio && newAddrRadio.checked) {
            toggleForm(true);
        } else {
            toggleForm(false);
        }
    };
</script>

</body>
</html>
