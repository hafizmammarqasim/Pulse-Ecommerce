<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Contact Support | Pulse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --bg-black: #121212; --bg-dark: #1e1e1e; --brand-red: #cc0000; --text-white: #ffffff; --border: #333; }
    body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }

    .container { max-width: 600px; margin: 40px auto; }

    .card {
        background-color: var(--bg-dark);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
        border-left: 5px solid var(--brand-red);
        padding-left: 15px;
        text-transform: uppercase;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .form-group { margin-bottom: 25px; }

    label {
        display: block;
        margin-bottom: 8px;
        color: #b3b3b3;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        background-color: #2a2a2a;
        border: 1px solid var(--border);
        color: var(--text-white);
        border-radius: 6px;
        font-family: inherit;
        font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--brand-red);
    }

    /* Readonly Look */
    input[readonly], select[readonly], .locked-input {
        background-color: #151515;
        color: #777;
        pointer-events: none;
        border-color: #222;
    }

    .btn-submit {
        width: 100%;
        background-color: var(--brand-red);
        color: white;
        padding: 15px;
        font-weight: 800;
        text-transform: uppercase;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-submit:hover { background-color: #aa0000; }

    .note { color: #666; font-size: 0.85rem; margin-top: 5px; }

    /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
        --bg-black: #121212;
        --bg-dark: #1e1e1e;
        --brand-red: #cc0000;
        --text-white: #ffffff;
        --text-gray: #b3b3b3;
        --border-color: #333;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
    }

    /* =========================================
       2. NAVBAR STYLES (REQUIRED FOR FRAGMENT)
       ========================================= */
    .navbar {
        background-color: var(--bg-dark);
        color: var(--text-white);
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--border-color);
    }

    /* Logo */
    .navbar-logo {
        text-decoration: none;
        font-size: 1.8em;
        font-weight: 900;
        color: var(--text-white);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 30px;
    }
    .navbar-logo span { color: var(--brand-red); }

    /* Search Bar */
    .navbar-search {
        display: flex;
        flex-grow: 1;
        max-width: 600px;
        background-color: #2a2a2a;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .navbar-search:focus-within { border-color: var(--brand-red); }
    .navbar-search input {
        width: 100%;
        padding: 12px 15px;
        border: none;
        background: none;
        outline: none;
        color: var(--text-white);
        font-size: 1rem;
    }
    .navbar-search button {
        background-color: var(--brand-red);
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: background-color 0.2s;
    }
    .navbar-search button:hover { background-color: #aa0000; }

    /* Links & Actions */
    .navbar-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-left: 30px;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .nav-link:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
    .nav-link.icon { font-size: 1.3rem; }

    /* Auth Buttons */
    .btn-login {
        background-color: var(--brand-red);
        color: var(--text-white);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.2s;
    }
    .btn-login:hover { background-color: #aa0000; }

    .btn-logout {
        background: none;
        border: none;
        color: var(--text-gray);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 12px;
        font-family: inherit;
        border-radius: 4px;
        transition: color 0.2s, background-color 0.2s;
    }
    .btn-logout:hover {
        color: var(--text-white);
        background-color: #2a2a2a;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
  <div class="card">
    <h2>Submit Request</h2>

    <form action="/support/save" method="post">

      <!-- HIDDEN ORDER ID (If coming from Order History) -->
      <input type="hidden" name="orderId" th:value="${preOrderId}">

      <!-- 1. TICKET TYPE -->
      <div class="form-group">
        <label>Issue Type</label>

        <!-- IF LOCKED (e.g. User clicked "Cancel Order") -->
        <div th:if="${isLocked}">
          <input type="text" class="locked-input" th:value="${preType}" readonly>
          <input type="hidden" name="type" th:value="${preType}">
        </div>

        <!-- IF UNLOCKED (e.g. User clicked "Contact Us") -->
        <div th:unless="${isLocked}">
          <select name="type">
            <option value="COMPLAINT">Complaint</option>
            <option value="INQUIRY">General Inquiry</option>
            <option value="WARRANTY">Warranty Claim</option>
            <!-- Return is hidden here because it uses the other special page -->
          </select>
        </div>
      </div>

      <!-- 2. SUBJECT -->
      <div class="form-group">
        <label>Subject</label>
        <input type="text" name="subject"
               th:value="${preOrderId != null ? preType + ' Request for Order #' + preOrderId : ''}"
               placeholder="Brief summary..." required>
      </div>

      <!-- 3. DESCRIPTION -->
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="5"
                  placeholder="Please provide details about your request..." required></textarea>
        <div class="note" th:if="${preOrderId != null}">
          Reference Order ID: <span th:text="${preOrderId}"></span>
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Ticket</button>

    </form>
  </div>
</div>

</body>
</html>
